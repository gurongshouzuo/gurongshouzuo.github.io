<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Supabase 连通测试</title>
<style>
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;max-width:560px;margin:0 auto;padding:24px 16px;color:#222}
  h1{font-size:22px}
  #result{margin:20px 0;padding:16px;border-radius:12px;background:#f4f4f4;font-size:18px;line-height:1.6;word-break:break-all}
  #result.ok{background:#e6f7e6}
  #result.err{background:#fde8e8}
  button{font-size:18px;padding:12px 24px;border-radius:10px;border:0;background:#1a7f37;color:#fff}
  .small{color:#666;font-size:14px}
</style>
</head>
<body>
<h1>Supabase 连通测试</h1>
<p class="small">打开这个页面会自动往新加坡的测试表里写一行数据，写成功就说明微信里能连上 Supabase。</p>
<div id="result">正在测试…</div>
<button id="retry" type="button">再试一次</button>
<p class="small" id="detail"></p>
<script>
const URL='https://rokaagkozrpkcsxfrgcj.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJva2FhZ2tvenJwa2NzeGZyZ2NqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUwNjYxODgsImV4cCI6MjExMDY0MjE4OH0.DNN4rLTCA2j4-G040lz6p_gjI8Gik7-AOtVDhtZFvR8';
async function test(){
  const box=document.getElementById('result');
  const det=document.getElementById('detail');
  box.className=''; box.textContent='正在测试…'; det.textContent='';
  const note='wechat-test '+new Date().toISOString();
  const t0=Date.now();
  try{
    const r=await fetch(URL+'/rest/v1/reachability_test',{
      method:'POST',
      headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json','Prefer':'return=representation'},
      body:JSON.stringify({note})
    });
    const ms=Date.now()-t0;
    if(!r.ok){ throw new Error('HTTP '+r.status+' '+(await r.text()).slice(0,200)); }
    const rows=await r.json();
    box.className='ok';
    box.textContent='✅ 成功：已写入测试数据，id='+rows[0].id+'，用时 '+(ms/1000).toFixed(1)+' 秒';
    det.textContent='note='+note+'，写于 '+new Date().toLocaleString('zh-CN');
  }catch(e){
    box.className='err';
    box.textContent='❌ 失败：'+e.message;
    det.textContent='请把这页截图发我。';
  }
}
document.getElementById('retry').addEventListener('click',test);
test();
</script>
</body>
</html>
